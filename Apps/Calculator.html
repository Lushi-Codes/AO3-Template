<style>
.calculator{color:#fff;padding:8px}
.calc-screen{height:150px;border-radius:6px;margin-bottom:12px;display:flex;align-items:flex-end;justify-content:flex-end;padding:18px}
.calc-display{background:transparent;border:0;color:#fff;font-size:30px;text-align:right;width:100%;outline:none}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.btn{border:0;border-radius:40px;height:64px;font-size:22px;color:#fff;background:#2b3334;cursor:pointer}
.btn.op{background:#0f6b45}
.btn.func{background:#0f6b45}
.btn.eq{background:#6fe6a6;color:#063}
.btn.wide{grid-column:4/5;height:72px;border-radius:36px}
.small{height:56px;border-radius:28px}
</style>

<div class="calculator">
  <div class="calc-screen"><input class="calc-display" readonly placeholder="0" /></div>
  <div class="calc-grid">
    <button class="btn func" data-action="clear">AC</button>
    <button class="btn func" data-action="back">⌫</button>
    <button class="btn func" data-action="neg">+/-</button>
    <button class="btn op" data-op="/">÷</button>

    <button class="btn" data-digit="7">7</button>
    <button class="btn" data-digit="8">8</button>
    <button class="btn" data-digit="9">9</button>
    <button class="btn op" data-op="*">×</button>

    <button class="btn" data-digit="4">4</button>
    <button class="btn" data-digit="5">5</button>
    <button class="btn" data-digit="6">6</button>
    <button class="btn op" data-op="-">−</button>

    <button class="btn" data-digit="1">1</button>
    <button class="btn" data-digit="2">2</button>
    <button class="btn" data-digit="3">3</button>
    <button class="btn op" data-op="+">+</button>

    <button class="btn" data-digit="%">%</button>
    <button class="btn" data-digit="0">0</button>
    <button class="btn" data-digit=".">.</button>
    <button class="btn eq" data-action="equals">=</button>
  </div>
</div>
