<style>
  .camera-feed-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #000;
  }
  .camera-feed {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    position: relative;
    overflow: hidden;
  }
  #cameraVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .camera-controls {
    padding: 12px;
    display: flex;
    gap: 8px;
    justify-content: center;
    background: #1a1a1a;
    border-top: 1px solid #333;
  }
  .camera-btn {
    background: #00a896;
    border: none;
    color: #fff;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
  }
  .camera-btn:hover {
    background: #00957f;
  }
  .camera-btn.record {
    background: #cc3333;
  }
  .camera-btn.record:hover {
    background: #bb2222;
  }
</style>

<div class="camera-feed-container">
  <div class="camera-feed">
    <video id="cameraVideo" autoplay playsinline></video>
  </div>
  <div class="camera-controls">
    <button class="camera-btn" id="cameraToggle">📷 Camera</button>
  </div>
</div>
