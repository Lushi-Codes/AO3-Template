<style>
  .camera-feed-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #000;
  }
  .camera-mode-label {
    padding: 12px 16px;
    text-align: center;
    color: #aaa;
    font-size: 13px;
    background: rgba(0,0,0,0.4);
    border-bottom: 1px solid #333;
  }
  .camera-feed {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2a2a2a;
    position: relative;
    overflow: hidden;
  }
  #cameraVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #cameraImage {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #cameraPlaceholder {
    width: 100%;
    height: 100%;
  }
  .camera-bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    background: rgba(0,0,0,0.9);
  }
  .camera-thumbnail {
    width: 50px;
    height: 50px;
    background: #333;
    border-radius: 6px;
    border: 2px solid #555;
  }
  .camera-capture-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid rgba(255,255,255,0.3);
    cursor: pointer;
    flex-shrink: 0;
  }
  .camera-capture-btn:active {
    background: #e0e0e0;
  }
  .camera-flip-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(100,150,200,0.4);
    border: 2px solid rgba(100,150,200,0.8);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .camera-flip-btn:active {
    background: rgba(100,150,200,0.6);
  }
  .selfie-photo {
    display: none;
  }
</style>
