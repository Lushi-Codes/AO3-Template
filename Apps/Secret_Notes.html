<style>
/* Secret Notes Styling */

.secret-note-card {
  background: #1e2421;
  border-left: 4px solid rgb(0, 193, 206);
  margin-bottom: 15px;
  padding: 12px;
  border-radius: 6px;
  color: #fff;
}

.secret-note-date {
  color: rgb(0, 193, 206);
  font-weight: bold;
  margin-bottom: 8px;
  font-size: 14px;
}

.secret-note-text {
  font-size: 13px;
  line-height: 1.5;
  color: #e0e0e0;
}

.locked-notes-section {
  padding: 15px;
  color: #fff;
}

.locked-notes-container {
  padding: 20px;
  text-align: center;
}

.locked-notes-icon {
  font-size: 48px;
  margin-bottom: 10px;
}

.locked-notes-label {
  color: #aaa;
  margin-bottom: 20px;
  font-size: 14px;
}

.locked-notes-input {
  width: 100%;
  padding: 10px;
  background: #111;
  border: 1px solid #444;
  border-radius: 6px;
  color: #fff;
  margin-bottom: 10px;
  box-sizing: border-box;
  font-family: inherit;
}

.locked-notes-input::placeholder {
  color: #666;
}

.locked-notes-button {
  width: 100%;
  padding: 10px;
  background: #0084ff;
  border: none;
  border-radius: 6px;
  color: #fff;
  cursor: pointer;
  font-weight: 500;
  font-size: 14px;
  transition: background 0.2s;
}

.locked-notes-button:hover {
  background: #0066cc;
}

.locked-notes-error {
  color: #ff6b6b;
  margin-top: 10px;
  font-size: 12px;
}

.notes-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid #333;
  margin-bottom: 10px;
}

.notes-tab {
  flex: 1;
  padding: 10px;
  background: none;
  border: none;
  color: #aaa;
  cursor: pointer;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}

.notes-tab.active {
  color: #0084ff;
  border-bottom: 2px solid #0084ff;
}

.notes-tab:hover:not(.active) {
  color: #ccc;
}
</style>

<div class="secret-note-card">
  <div class="secret-note-date"></div>
  <div class="secret-note-text"></div>
</div>

<div class="secret-note-card">
  <div class="secret-note-date"></div>
  <div class="secret-note-text"><br><br></div>
</div>

<div class="secret-note-card">
  <div class="secret-note-date"></div>
  <div class="secret-note-text">N<br><br></div>
</div>
